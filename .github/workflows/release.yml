# Builds the Windows installer and publishes it to GitHub Releases when a version tag is pushed.
# Installed copies of the mod pick the new release up automatically (electron-updater).
#
#   npm version patch        # bumps package.json and creates the vX.Y.Z tag
#   git push --follow-tags   # triggers this workflow
#
# The release is created in one step after the build (not by electron-builder's parallel uploads,
# which created a second release per tag and broke update downloads).
#
# Every installer gets a signed build provenance attestation (Sigstore, via GitHub), so anyone can
# check that a download was built here from this repository's code:
#   gh attestation verify HappyWheelsMultiplayer-Setup-x.y.z.exe -R BLUNT-Chief/happywheels-multiplayer
# This is not Windows code signing: it doesn't change what SmartScreen or antivirus scanners show.
#
# Run it by hand (Actions -> Release -> Run workflow) for a dry run: it builds and attests the
# installer but publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write          # Sigstore signing certificate for the attestation
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"; exit 1
          fi

      - run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          # Optional code signing (removes the SmartScreen warning). Add these repository secrets
          # to enable it: a base64 .pfx certificate and its password.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Publish release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="dist/HappyWheelsMultiplayer-Setup-${version}.exe"
          for f in "$installer" "$installer.blockmap" dist/latest.yml; do
            [ -f "$f" ] || { echo "missing build output: $f"; exit 1; }
          done
          grep -q "^version: ${version}$" dist/latest.yml || { echo "latest.yml is not for ${version}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$installer" "$installer.blockmap" dist/latest.yml \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/HappyWheelsMultiplayer-Setup-*.exe
