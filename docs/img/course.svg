<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa6e8"/>
      <stop offset="1" stop-color="#bfe0f7"/>
    </linearGradient>
    <pattern id="check" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#fff"/>
      <rect width="6" height="6" fill="#222"/>
      <rect x="6" y="6" width="6" height="6" fill="#222"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/>
    </marker>
  </defs>

  <rect width="960" height="400" rx="18" fill="url(#sky)"/>
  <!-- ground -->
  <path d="M0,300 L150,300 C230,300 260,250 330,250 C400,250 420,300 500,300 L560,300 C640,300 660,230 740,230 L960,230 L960,400 L0,400 z" fill="#6bb04a"/>
  <path d="M0,300 L150,300 C230,300 260,250 330,250 C400,250 420,300 500,300 L560,300 C640,300 660,230 740,230 L960,230" fill="none" stroke="#4a8a32" stroke-width="5"/>

  <!-- level's own start point -->
  <g transform="translate(58,300)">
    <line x1="0" y1="0" x2="0" y2="-54" stroke="#555" stroke-width="3"/>
    <path d="M0,-54 L26,-46 L0,-38 z" fill="#9aa3ad"/>
    <text x="-8" y="26" font-size="12" fill="#1d2330">level start</text>
    <text x="-8" y="41" font-size="12" fill="#1d2330">(single-player, AI)</text>
  </g>

  <!-- spawns -->
  <g font-weight="700" font-size="14" fill="#fff">
    <g transform="translate(98,262)"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#f2708a" stroke="#fff" stroke-width="2"/><text x="0" y="5" text-anchor="middle">S1</text></g>
    <g transform="translate(140,262)"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#f2708a" stroke="#fff" stroke-width="2"/><text x="0" y="5" text-anchor="middle">S2</text></g>
    <g transform="translate(182,262)"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#f2708a" stroke="#fff" stroke-width="2"/><text x="0" y="5" text-anchor="middle">S3</text></g>
    <g transform="translate(224,254)"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#f2708a" stroke="#fff" stroke-width="2"/><text x="0" y="5" text-anchor="middle">S4</text></g>
  </g>

  <!-- checkpoint 1 -->
  <circle cx="420" cy="262" r="58" fill="#5cc26d" fill-opacity=".12" stroke="#3f9a50" stroke-width="2.5" stroke-dasharray="8 6"/>
  <g transform="translate(420,262)"><circle r="15" fill="#3f8fd6" stroke="#fff" stroke-width="2.5"/><text y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text></g>
  <line x1="437" y1="262" x2="478" y2="262" stroke="#3f9a50" stroke-width="2"/>
  <text x="458" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#256b33">3 m</text>

  <!-- checkpoint 2 -->
  <circle cx="650" cy="232" r="58" fill="#5cc26d" fill-opacity=".12" stroke="#3f9a50" stroke-width="2.5" stroke-dasharray="8 6"/>
  <g transform="translate(650,232)"><circle r="15" fill="#3f8fd6" stroke="#fff" stroke-width="2.5"/><text y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text></g>

  <!-- finish -->
  <circle cx="860" cy="196" r="58" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-width="2.5" stroke-dasharray="8 6"/>
  <g transform="translate(860,196)"><rect x="-34" y="-14" width="68" height="28" rx="6" fill="url(#check)" stroke="#222" stroke-width="2"/><rect x="-26" y="-9" width="52" height="18" rx="3" fill="#fff" fill-opacity=".85"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">FINISH</text></g>

  <!-- route arrow and lap loop -->
  <path d="M250,222 C300,190 360,196 400,214" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M470,212 C530,180 580,176 628,196" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M700,190 C750,160 790,156 828,168" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M860,130 C840,40 520,30 420,190" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- labels -->
  <g font-size="13" fill="#1d2330">
    <rect x="590" y="38" width="206" height="42" rx="8" fill="#fff" fill-opacity=".92"/>
    <text x="602" y="56" font-weight="700">Lap race (#mp laps 2)</text>
    <text x="602" y="72">finish → back to checkpoint 1</text>

    <rect x="92" y="150" width="190" height="42" rx="8" fill="#fff" fill-opacity=".92"/>
    <text x="104" y="168" font-weight="700">#mp spawn 1 … 4</text>
    <text x="104" y="184">racers spread across these</text>

    <rect x="330" y="334" width="190" height="42" rx="8" fill="#fff" fill-opacity=".92"/>
    <text x="342" y="352" font-weight="700">#mp checkpoint 1</text>
    <text x="342" y="368">counts within ~3 m of the box</text>

    <rect x="760" y="300" width="176" height="42" rx="8" fill="#fff" fill-opacity=".92"/>
    <text x="772" y="318" font-weight="700">#mp finish</text>
    <text x="772" y="334">replaces the level's finish</text>
  </g>
</svg>
